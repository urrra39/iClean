name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build (Developer ID if configured, otherwise ad-hoc)
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: scripts/build-release.sh
      - name: Notarize
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit dist/iClear-*.zip --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple dist/iClear.app
          rm dist/iClear-*.zip
          (cd dist && ditto -c -k --keepParent iClear.app "iClear-${GITHUB_REF_NAME#v}.zip")
      - name: Checksums
        run: cd dist && shasum -a 256 iClear-*.zip iclear-*-macos.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "Beta. Tested with synthetic test processes and on one Mac (Apple M3 Pro, macOS 27.0.1); the test suite also passes in CI on macOS 15 (Apple Silicon and Intel) and macOS 26. Active mode on real apps is not yet validated. iClear starts in Observe mode."
            echo
            echo "## Downloads"
            echo
            echo "- \`iClear-$VERSION.zip\`: menu-bar app (command-line tools inside \`iClear.app/Contents/Helpers\`)."
            echo "- \`iclear-$VERSION-macos.tar.gz\`: \`iclear\`, \`icleard\` and \`ic-hog\` (needed by \`iclear bench\`)."
            echo
            echo "Universal binaries (arm64 and x86_64), built for macOS 13 and later."
            echo
            echo "## First launch"
            echo
            echo "These builds are ad-hoc signed and not notarized. For the app: right-click iClear.app, choose Open, confirm. For the command-line tools: \`xattr -d com.apple.quarantine iclear icleard ic-hog\`, then \`./iclear install\`."
            echo
            echo "## SHA256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Changes: see CHANGELOG.md."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --prerelease --title "iClear $VERSION (beta)" --notes-file notes.md \
            dist/iClear-*.zip dist/iclear-*-macos.tar.gz dist/SHA256SUMS.txt
