name: Bug report
description: Something iClear did, or did not do, that it should not have.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the output of `iclear explain <app>` for the app involved, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: iclear doctor --report
      description: Paste the output. It contains no hostname, user name, serial or IP address. Read it before pasting.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Anonymized trace (optional)
      description: "`iclear trace export --anonymize --since 1d --out trace.jsonl`, then attach the file."
